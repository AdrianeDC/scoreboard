<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreboard — Live Rankings</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d0f14;
        --bg2: #141720;
        --bg3: #1c2030;
        --border: rgba(255, 255, 255, 0.08);
        --text: #e8eaf0;
        --muted: #7a7f96;
        --gold: #f5c542;
        --silver: #a8b5c8;
        --bronze: #cd7f4a;
        --mvp: #b07cff;
        --green: #3ecf8e;
        --red: #f87171;
        --blue: #60a5fa;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* ── TOP NAV ── */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 24px;
        background: var(--bg2);
        border-bottom: 1px solid var(--border);
      }
      .logo-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo-badge {
        width: 34px;
        height: 34px;
        background: var(--gold);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Rajdhani", sans-serif;
        font-weight: 700;
        color: #000;
        font-size: 18px;
      }
      .logo-text h1 {
        font-family: "Rajdhani", sans-serif;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        line-height: 1;
      }
      .logo-text p {
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 2px;
      }

      /* ── DASHBOARD (NEW) ── */
      .main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px;
      }
      .dashboard {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 20px;
      }
      .card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        border-top: 2px solid var(--blue);
      }
      .card-label {
        font-size: 10px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .card-value {
        font-family: "Rajdhani", sans-serif;
        font-weight: 700;
        font-size: 26px;
        color: #fff;
      }
      .card-sub {
        font-size: 10px;
        color: var(--muted);
        margin-top: 4px;
      }

      /* ── ALERT BAR (NEW) ── */
      .alert-bar {
        background: rgba(62, 207, 142, 0.05);
        border: 1px solid rgba(62, 207, 142, 0.2);
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 24px;
        display: none;
        align-items: center;
        gap: 10px;
        color: var(--green);
        font-size: 13px;
        font-weight: 500;
      }
      .alert-bar.active {
        display: flex;
        animation: slideIn 0.4s ease;
      }
      @keyframes slideIn {
        from {
          transform: translateY(-10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      /* ── TABLE & RESPONSIVENESS ── */
      .table-wrap {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      .grid-layout {
        display: grid;
        grid-template-columns: 45px 1fr 55px 55px 55px 55px 55px 65px 80px;
        align-items: center;
        padding: 14px 20px;
      }

      @media (max-width: 800px) {
        .dashboard {
          grid-template-columns: 1fr 1fr;
        }
        .grid-layout {
          grid-template-columns: 40px 1fr 60px 70px;
        } /* Only Rank, Name, Wins, Pts */
        .hide-mobile {
          display: none !important;
        }
        .card-value {
          font-size: 22px;
        }
      }

      .table-head {
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.02);
      }
      .table-head span {
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        text-align: center;
      }
      .table-head span:nth-child(2) {
        text-align: left;
      }

      .table-row {
        border-bottom: 1px solid var(--border);
        transition: 0.3s;
        opacity: 0;
        transform: translateY(10px);
      }
      .table-row.show {
        opacity: 1;
        transform: translateY(0);
      }
      .rank-badge {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        background: var(--bg3);
        font-weight: 700;
      }
      .rank-1 {
        color: var(--gold);
        border: 1.5px solid var(--gold);
        background: rgba(245, 197, 66, 0.1);
      }
      .player-name {
        font-weight: 600;
        font-size: 14px;
        text-transform: uppercase;
      }
      .cell {
        text-align: center;
        font-size: 14px;
        color: var(--muted);
      }
      .points-val {
        text-align: right;
        font-family: "Rajdhani", sans-serif;
        font-weight: 700;
        font-size: 22px;
        color: var(--gold);
      }

      /* ── UI ELEMENTS ── */
      .btn {
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--bg3);
        color: var(--text);
        font-weight: 600;
      }
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal-overlay.open {
        display: flex;
      }
      .modal {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 16px;
        width: 100%;
        max-width: 400px;
        padding: 24px;
      }
      select {
        width: 100%;
        padding: 12px;
        margin-bottom: 14px;
        background: var(--bg3);
        color: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="logo-group">
        <div class="logo-badge">S</div>
        <div class="logo-text">
          <h1>SCOREBOARD</h1>
          <p>LIVE RANKINGS</p>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <div
          style="
            color: var(--green);
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
          "
        >
          <span
            style="
              width: 6px;
              height: 6px;
              background: var(--green);
              border-radius: 50%;
            "
          ></span>
          LIVE
        </div>
        <button class="btn" onclick="openAdmin()">Admin</button>
      </div>
    </div>

    <div class="main">
      <div class="dashboard">
        <div class="card">
          <div class="card-label">Players</div>
          <div class="card-value" id="stat-count">0</div>
        </div>
        <div class="card">
          <div class="card-label">Top Score</div>
          <div class="card-value" id="stat-top">0</div>
        </div>
        <div class="card">
          <div class="card-label">Leader</div>
          <div class="card-value" id="stat-leader">—</div>
        </div>
        <div class="card">
          <div class="card-label">Last Sync</div>
          <div class="card-value" id="stat-time">--:--</div>
          <div class="card-sub">auto · 15s</div>
        </div>
      </div>

      <div id="alert-bar" class="alert-bar">
        <span>⚡</span> <span id="alert-text"></span>
      </div>

      <div class="table-wrap">
        <div class="table-head grid-layout">
          <span>#</span><span>Player</span> <span class="hide-mobile">MVP</span
          ><span class="hide-mobile">G</span> <span class="hide-mobile">S</span
          ><span class="hide-mobile">B</span> <span class="hide-mobile">L</span
          ><span>Wins</span><span style="text-align: right">Pts</span>
        </div>
        <div id="leaderboard"></div>
      </div>
    </div>

    <div class="modal-overlay" id="admin-modal">
      <div class="modal">
        <h2 style="margin-bottom: 20px; font-family: Rajdhani">Award Points</h2>
        <label style="font-size: 11px; color: var(--muted)">PLAYER</label>
        <select id="award-player"></select>
        <label style="font-size: 11px; color: var(--muted)">MEDAL TYPE</label>
        <select id="award-type">
          <option value="mvp">MVP (+5)</option>
          <option value="gold">Gold (+4)</option>
          <option value="silver">Silver (+3)</option>
          <option value="bronze">Bronze (-1)</option>
          <option value="mvp_loss">MVP Loss (+1)</option>
        </select>
        <label style="font-size: 11px; color: var(--muted)">SCORING MODE</label>
        <select id="award-mode">
          <option value="group">Standard (Group)</option>
          <option value="solo">Solo Catch-Up (Buffed)</option>
        </select>
        <div style="display: flex; gap: 10px; margin-top: 10px">
          <button class="btn" style="flex: 1" onclick="closeModals()">
            Cancel
          </button>
          <button
            class="btn"
            style="
              flex: 1;
              background: var(--blue);
              border-color: var(--blue);
              color: #000;
            "
            onclick="doAward()"
          >
            Confirm
          </button>
        </div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        doc,
        onSnapshot,
        updateDoc,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAHa6RAfBlWGO1aWQ1jOPV3fXwTMrUpS1A",
        authDomain: "scoreboard-3c806.firebaseapp.com",
        projectId: "scoreboard-3c806",
        storageBucket: "scoreboard-3c806.firebasestorage.app",
        messagingSenderId: "435688264712",
        appId: "1:435688264712:web:4e46118ced567202866dbd",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      let players = [];
      let sorted = [];

      onSnapshot(collection(db, "players"), (snap) => {
        players = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        sorted = [...players].sort((a, b) => (b.points || 0) - (a.points || 0));
        updateUI();
      });

      function updateUI() {
        // Update Stats
        document.getElementById("stat-count").textContent = players.length;
        document.getElementById("stat-top").textContent =
          sorted[0]?.points || 0;
        document.getElementById("stat-leader").textContent =
          sorted[0]?.name || "—";
        document.getElementById("stat-time").textContent =
          new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
          });

        // Update Alert
        const alertBar = document.getElementById("alert-bar");
        const last = sorted[sorted.length - 1];
        const gap = (sorted[0]?.points || 0) - (last?.points || 0);
        if (gap >= 15 && last) {
          alertBar.classList.add("active");
          document.getElementById("alert-text").textContent =
            `Solo catch-up eligible: ${last.name} (${gap} pts behind)`;
        } else {
          alertBar.classList.remove("active");
        }

        // Render Table
        const lb = document.getElementById("leaderboard");
        lb.innerHTML = sorted
          .map(
            (p, i) => `
          <div class="table-row grid-layout">
            <div><div class="rank-badge ${i === 0 ? "rank-1" : ""}">${i + 1}</div></div>
            <div class="player-name">${p.name}</div>
            <div class="cell hide-mobile">${p.mvp || 0}</div>
            <div class="cell hide-mobile">${p.gold || 0}</div>
            <div class="cell hide-mobile">${p.silver || 0}</div>
            <div class="cell hide-mobile">${p.bronze || 0}</div>
            <div class="cell hide-mobile">${p.mvp_loss || 0}</div>
            <div class="cell">${(p.mvp || 0) + (p.gold || 0) + (p.silver || 0)}</div>
            <div class="points-val">${p.points || 0}</div>
          </div>`,
          )
          .join("");

        setTimeout(
          () =>
            document
              .querySelectorAll(".table-row")
              .forEach((r, i) =>
                setTimeout(() => r.classList.add("show"), i * 40),
              ),
          50,
        );
        document.getElementById("award-player").innerHTML = sorted
          .map((p) => `<option value="${p.id}">${p.name}</option>`)
          .join("");
      }

      window.doAward = async function () {
        const pId = document.getElementById("award-player").value;
        const type = document.getElementById("award-type").value;
        const mode = document.getElementById("award-mode").value;
        const p = players.find((x) => x.id === pId);

        const ptsMap =
          mode === "solo"
            ? { mvp: 7, gold: 5, silver: 4, bronze: 0, mvp_loss: 2 }
            : { mvp: 5, gold: 4, silver: 3, bronze: -1, mvp_loss: 1 };

        await updateDoc(doc(db, "players", pId), {
          [type]: (p[type] || 0) + 1,
          points: (p.points || 0) + ptsMap[type],
        });
        closeModals();
      };

      window.openAdmin = () =>
        document.getElementById("admin-modal").classList.add("open");
      window.closeModals = () =>
        document.getElementById("admin-modal").classList.remove("open");
    </script>
  </body>
</html>
