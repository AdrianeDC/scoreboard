<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreboard — Live Rankings</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d0f14;
        --bg2: #141720;
        --bg3: #1c2030;
        --border: rgba(255, 255, 255, 0.08);
        --text: #e8eaf0;
        --muted: #7a7f96;
        --gold: #f5c542;
        --silver: #a8b5c8;
        --bronze: #cd7f4a;
        --mvp: #b07cff;
        --green: #3ecf8e;
        --red: #f87171;
        --blue: #60a5fa;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* ── TOP BAR ── */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px;
        background: var(--bg2);
        border-bottom: 1px solid var(--border);
      }
      .logo-badge {
        width: 32px;
        height: 32px;
        background: var(--gold);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Rajdhani", sans-serif;
        font-weight: 700;
        color: #000;
      }
      .logo-text {
        font-family: "Rajdhani", sans-serif;
        font-weight: 700;
        font-size: 20px;
        text-transform: uppercase;
      }

      /* ── DASHBOARD ── */
      .main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
      }
      .dashboard {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 20px;
      }
      .card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
      }
      .card-label {
        font-size: 9px;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .card-value {
        font-family: "Rajdhani", sans-serif;
        font-weight: 700;
        font-size: 22px;
      }

      /* ── ALERT BAR ── */
      .alert-bar {
        background: rgba(62, 207, 142, 0.05);
        border: 1px solid rgba(62, 207, 142, 0.2);
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 20px;
        display: none;
        font-size: 12px;
        color: var(--green);
      }
      .alert-bar.active {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* ── TABLE RESPONSIVENESS ── */
      .table-wrap {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }

      /* Standard Desktop Grid: 9 Columns */
      .grid-layout {
        display: grid;
        grid-template-columns: 40px 1fr 50px 50px 50px 50px 50px 60px 70px;
        align-items: center;
        padding: 12px 16px;
      }

      /* Responsive Layout: Hide less critical data on mobile */
      @media (max-width: 768px) {
        .dashboard {
          grid-template-columns: 1fr 1fr;
        }
        .grid-layout {
          grid-template-columns: 35px 1fr 45px 55px; /* Rank, Name, Wins, Points */
        }
        /* Hide Medal breakdown on small screens */
        .hide-mobile {
          display: none !important;
        }
        .rulebook-container {
          grid-template-columns: 1fr;
        }
      }

      .table-head {
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.02);
      }
      .table-head span {
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        text-align: center;
      }
      .table-head span:nth-child(2) {
        text-align: left;
      }

      .table-row {
        border-bottom: 1px solid var(--border);
        transition: 0.3s;
        opacity: 0;
        transform: translateY(10px);
      }
      .table-row.show {
        opacity: 1;
        transform: translateY(0);
      }
      .rank-badge {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        background: var(--bg3);
      }
      .rank-1 {
        color: var(--gold);
        border: 1px solid var(--gold);
      }
      .player-name {
        font-weight: 600;
        font-size: 13px;
        text-transform: uppercase;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cell {
        text-align: center;
        font-size: 13px;
        color: var(--muted);
      }
      .points-val {
        text-align: right;
        font-family: "Rajdhani", sans-serif;
        font-weight: 700;
        font-size: 20px;
        color: var(--gold);
      }

      /* ── RULES ── */
      .rulebook-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 20px;
      }
      .rule-column {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
      }
      .rule-header {
        font-size: 9px;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .legend-item {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-bottom: 4px;
      }

      /* ── ADMIN MODAL ── */
      .btn {
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--bg3);
        color: var(--text);
      }
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal-overlay.open {
        display: flex;
      }
      .modal {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 12px;
        width: 100%;
        max-width: 400px;
        padding: 20px;
      }
      select {
        width: 100%;
        padding: 10px;
        margin-bottom: 12px;
        background: var(--bg3);
        color: #fff;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div style="display: flex; align-items: center; gap: 10px">
        <div class="logo-badge">S</div>
        <div class="logo-text">Scoreboard</div>
      </div>
      <button class="btn" onclick="openAdmin()">Admin</button>
    </div>

    <div class="main">
      <div class="dashboard">
        <div class="card">
          <div class="card-label">Top Score</div>
          <div class="card-value" id="stat-top">0</div>
        </div>
        <div class="card">
          <div class="card-label">Leader</div>
          <div class="card-value" id="stat-leader">—</div>
        </div>
        <div class="card hide-mobile">
          <div class="card-label">Players</div>
          <div class="card-value" id="stat-count">0</div>
        </div>
        <div class="card">
          <div class="card-label">Sync</div>
          <div class="card-value" style="font-size: 16px" id="stat-time">
            --:--
          </div>
        </div>
      </div>

      <div id="alert-bar" class="alert-bar">
        ⚡ <span id="alert-text"></span>
      </div>

      <div class="table-wrap">
        <div class="table-head grid-layout">
          <span>#</span><span>Player</span> <span class="hide-mobile">MVP</span
          ><span class="hide-mobile">G</span> <span class="hide-mobile">S</span
          ><span class="hide-mobile">B</span> <span class="hide-mobile">L</span
          ><span>Wins</span><span style="text-align: right">Pts</span>
        </div>
        <div id="leaderboard"></div>
      </div>
    </div>

    <div class="modal-overlay" id="admin-modal">
      <div class="modal">
        <h3 style="margin-bottom: 15px">Award Points</h3>
        <select id="award-player"></select>
        <select id="award-type">
          <option value="mvp">MVP</option>
          <option value="gold">Gold</option>
          <option value="silver">Silver</option>
          <option value="bronze">Bronze</option>
          <option value="mvp_loss">MVP Loss</option>
        </select>
        <select id="award-mode">
          <option value="group">Group</option>
          <option value="solo">Solo Catch-Up</option>
        </select>
        <div style="display: flex; gap: 8px">
          <button class="btn" style="flex: 1" onclick="closeModals()">
            Cancel
          </button>
          <button
            class="btn"
            style="flex: 1; background: var(--blue)"
            onclick="doAward()"
          >
            Confirm
          </button>
        </div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        doc,
        onSnapshot,
        updateDoc,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAHa6RAfBlWGO1aWQ1jOPV3fXwTMrUpS1A",
        authDomain: "scoreboard-3c806.firebaseapp.com",
        projectId: "scoreboard-3c806",
        storageBucket: "scoreboard-3c806.firebasestorage.app",
        messagingSenderId: "435688264712",
        appId: "1:435688264712:web:4e46118ced567202866dbd",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      let players = [];
      let sorted = [];

      onSnapshot(collection(db, "players"), (snap) => {
        players = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        sorted = [...players].sort((a, b) => (b.points || 0) - (a.points || 0));
        updateUI();
      });

      function updateUI() {
        document.getElementById("stat-top").textContent =
          sorted[0]?.points || 0;
        document.getElementById("stat-leader").textContent =
          sorted[0]?.name || "—";
        document.getElementById("stat-count").textContent = players.length;
        document.getElementById("stat-time").textContent =
          new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
          });

        const alertBar = document.getElementById("alert-bar");
        const gap =
          (sorted[0]?.points || 0) - (sorted[sorted.length - 1]?.points || 0);
        if (gap >= 15) {
          alertBar.classList.add("active");
          document.getElementById("alert-text").textContent =
            `${sorted[sorted.length - 1].name} is ${gap} behind!`;
        }

        const lb = document.getElementById("leaderboard");
        lb.innerHTML = sorted
          .map(
            (p, i) => `
          <div class="table-row grid-layout">
            <div><div class="rank-badge ${i < 3 ? "rank-1" : ""}">${i + 1}</div></div>
            <div class="player-name">${p.name}</div>
            <div class="cell hide-mobile">${p.mvp || 0}</div>
            <div class="cell hide-mobile">${p.gold || 0}</div>
            <div class="cell hide-mobile">${p.silver || 0}</div>
            <div class="cell hide-mobile">${p.bronze || 0}</div>
            <div class="cell hide-mobile">${p.mvp_loss || 0}</div>
            <div class="cell">${(p.mvp || 0) + (p.gold || 0) + (p.silver || 0)}</div>
            <div class="points-val">${p.points || 0}</div>
          </div>`,
          )
          .join("");

        setTimeout(
          () =>
            document
              .querySelectorAll(".table-row")
              .forEach((r, i) =>
                setTimeout(() => r.classList.add("show"), i * 50),
              ),
          50,
        );
        document.getElementById("award-player").innerHTML = sorted
          .map((p) => `<option value="${p.id}">${p.name}</option>`)
          .join("");
      }

      window.doAward = async function () {
        const pId = document.getElementById("award-player").value;
        const type = document.getElementById("award-type").value;
        const mode = document.getElementById("award-mode").value;
        const p = players.find((x) => x.id === pId);
        const ptsMap =
          mode === "solo"
            ? { mvp: 7, gold: 5, silver: 4, bronze: 0, mvp_loss: 2 }
            : { mvp: 5, gold: 4, silver: 3, bronze: -1, mvp_loss: 1 };
        await updateDoc(doc(db, "players", pId), {
          [type]: (p[type] || 0) + 1,
          points: (p.points || 0) + ptsMap[type],
        });
        closeModals();
      };

      window.openAdmin = () =>
        document.getElementById("admin-modal").classList.add("open");
      window.closeModals = () =>
        document.getElementById("admin-modal").classList.remove("open");
    </script>
  </body>
</html>
